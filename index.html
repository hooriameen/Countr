<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
      }

      .counter {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      #count {
        display: block;
        font-size: 128px;
        font-weight: 900;
        margin-bottom: 1rem;
      }

      .buttons {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      button {
        display: inline-block;
        background: none;
        border: none;
        outline: none;
        color: white;
        font-size: 20px;
        font-weight: 700;
        text-transform: uppercase;
        border-radius: 0.25rem;
        padding: 0.5rem 1rem;
      }

      .btn-dec {
        background-color: orange;
      }

      .btn-inc {
        background-color: forestgreen;
      }

      .btn-reset {
        background-color: crimson;
      }

      .btn-dec:hover {
        background-color: rgb(228, 149, 4);
      }

      .btn-inc:hover {
        background-color: rgb(20, 119, 20);
      }

      .btn-reset:hover {
        background-color: rgb(185, 17, 51);
      }

      .btn-dec:disabled {
        background-color: rgb(214, 164, 72);
      }

      .btn-reset:disabled {
        background-color: rgb(187, 76, 98);
      }
    </style>
  </head>

  <body>
    <div class="counter">
      <div id="count">0</div>
      <div class="buttons">
        <button class="btn-inc" id="inc">+</button>
        <button class="btn-dec" id="dec">-</button>
        <button class="btn-reset" id="reset">o</button>
      </div>
    </div>

    <script>
      let count = 0;
      let countZero = document.getElementById("count");
      let incBtn = document.getElementById("inc");
      let decBtn = document.getElementById("dec");
      let resetBtn = document.getElementById("reset");
      let isRunning;
      let intervalId;

      const countFunc = () => {
        if (!isRunning) {
          isRunning = true;
          intervalId = setInterval(() => {
            count++;
            countZero.innerText = count;
            decBtn.disabled = false;
            resetBtn.disabled = false;
          }, 1000);
        } else {
          isRunning = false;
          clearInterval(intervalId);
        }
      };
      incBtn.addEventListener("click", countFunc);

      decBtn.addEventListener("click", () => {
         clearInterval(intervalId);
         isRunning = false;
         
        if (count == 0) {
          decBtn.disabled = true;
          resetBtn.disabled = true;
        } else {
          count--;
          countZero.innerText = count;  
        }
      });

      resetBtn.addEventListener("click", () => {
        count = 0;
        countZero.innerText = count;
        clearInterval(intervalId);
        isRunning = false;

        decBtn.disabled = true;
        resetBtn.disabled = true;
      });
    </script>
  </body>
</html>
